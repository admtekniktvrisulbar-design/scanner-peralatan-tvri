<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner Peralatan TVRI Sulawesi Barat</title>


  <!-- ============================================================
       LIBRARY QR SCANNER
       ============================================================ -->

  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    /* ============================================================
       DASAR
       ============================================================ */

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }


    /* ============================================================
       CONTAINER
       ============================================================ */

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }


    /* ============================================================
       CARD
       ============================================================ */

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 20px;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.08);
    }


    /* ============================================================
       JUDUL
       ============================================================ */

    h1 {
      margin: 0 0 6px;
      font-size: 23px;
      color: #222;
    }


    .subtitle {
      margin-bottom: 20px;
      font-size: 13px;
      color: #666;
    }


    /* ============================================================
       AREA KAMERA
       ============================================================ */

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
    }


    /* ============================================================
       STATUS SCANNER
       ============================================================ */

    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #f5f5f5;

      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }


    /* ============================================================
       DETAIL HASIL SCAN
       ============================================================ */

    .hasil {
      display: none;

      margin-top: 16px;
      padding: 15px;

      border-radius: 10px;
      background: #f8f9fa;
      border: 1px solid #e0e0e0;
    }


    .hasil-label {
      margin-bottom: 5px;

      font-size: 11px;
      font-weight: 700;
      color: #666;

      letter-spacing: 0.3px;
    }


    .hasil-id {
      margin-bottom: 14px;

      font-size: 18px;
      font-weight: 700;
      color: #1976d2;

      word-break: break-word;
    }


    /* ============================================================
       DETAIL ALAT
       ============================================================ */

    .detail-alat {
      overflow: hidden;

      border: 1px solid #e0e0e0;
      border-radius: 10px;
      background: #ffffff;
    }


    .detail-row {
      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      gap: 15px;
      padding: 11px 12px;

      border-bottom: 1px solid #eeeeee;

      font-size: 13px;
    }


    .detail-row:last-child {
      border-bottom: none;
    }


    .detail-row span {
      flex: 0 0 42%;
      color: #666;
    }


    .detail-row strong {
      flex: 1;

      text-align: right;
      color: #222;

      word-break: break-word;
    }


    /* ============================================================
       STATUS ALAT
       ============================================================ */

    .status-alat {
      margin-top: 15px;

      padding: 14px;

      border-radius: 10px;

      text-align: center;

      background: #f5f5f5;
    }


    .status-alat-label {
      margin-bottom: 5px;

      font-size: 11px;
      font-weight: 700;
      color: #666;

      letter-spacing: 0.3px;
    }


    .status-alat-value {
      font-size: 18px;
      font-weight: 700;
    }


    .status-tersedia {
      background: #e8f5e9;
      color: #137333;
    }


    .status-digunakan {
      background: #ffebee;
      color: #c62828;
    }


    .status-lain {
      background: #fff8e1;
      color: #e65100;
    }


    /* ============================================================
       TOMBOL
       ============================================================ */

    .button {
      width: 100%;

      margin-top: 12px;

      padding: 14px 16px;

      border: none;
      border-radius: 9px;

      background: #1976d2;
      color: #ffffff;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.1s ease;
    }


    .button:hover {
      background: #1565c0;
    }


    .button:active {
      transform: scale(0.99);
    }


    .button:disabled {
      background: #bdbdbd;
      cursor: not-allowed;
      opacity: 0.7;
    }


    /* ============================================================
       TOMBOL MANUAL
       ============================================================ */

    .button-secondary {
      width: 100%;

      margin-top: 10px;

      padding: 13px 16px;

      border: 1px solid #1976d2;
      border-radius: 9px;

      background: #ffffff;
      color: #1976d2;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;
    }


    .button-secondary:hover {
      background: #f0f7ff;
    }


    /* ============================================================
       PESAN ERROR
       ============================================================ */

    .error-box {
      display: none;

      margin-top: 15px;

      padding: 13px;

      border-radius: 9px;

      background: #ffebee;
      color: #c62828;

      font-size: 13px;
      line-height: 1.5;
    }


    /* ============================================================
       KERANJANG
       ============================================================ */

    .keranjang-panel {
      margin-top: 20px;

      padding: 15px;

      background: #f5f5f5;

      border-radius: 10px;
    }


    .keranjang-title {
      margin-bottom: 6px;

      font-size: 13px;
      color: #666;
    }


    .keranjang-jumlah {
      margin-bottom: 12px;

      font-size: 18px;
      font-weight: bold;
    }


    .keranjang-kosong {
      color: #777;
      font-size: 13px;
    }


    .keranjang-item {
      margin-bottom: 10px;

      padding: 12px;

      background: #ffffff;

      border: 1px solid #ddd;
      border-radius: 8px;
    }


    .keranjang-item:last-child {
      margin-bottom: 0;
    }


    .keranjang-item-nama {
      margin-bottom: 5px;

      font-weight: bold;
    }


    .keranjang-item-id {
      margin-bottom: 8px;

      font-size: 12px;
      color: #666;
    }


    .keranjang-item-detail {
      font-size: 12px;
      line-height: 1.5;
    }


    .button-hapus {
      width: 100%;

      margin-top: 10px;

      padding: 10px;

      border: none;
      border-radius: 8px;

      background: #d32f2f;
      color: #ffffff;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;
    }


    .button-hapus:hover {
      background: #b71c1c;
    }


    /* ============================================================
       MOBILE
       ============================================================ */

    @media (max-width: 500px) {

      .container {
        padding: 12px;
      }


      .card {
        padding: 16px;
      }


      h1 {
        font-size: 21px;
      }


      .detail-row {
        gap: 10px;
      }

    }

  </style>

</head>


<body>


<div class="container">

  <div class="card">


    <!-- ==========================================================
         JUDUL
         ========================================================== -->

    <h1>
      Scan QR Peralatan
    </h1>


    <div class="subtitle">
      Sistem Peralatan Teknik TVRI Sulawesi Barat
    </div>


    <!-- ==========================================================
         KAMERA
         ========================================================== -->

    <div id="reader"></div>


    <!-- ==========================================================
         STATUS SCANNER
         ========================================================== -->

    <div
      id="statusScanner"
      class="status"
    >
      Menyiapkan kamera...
    </div>


    <!-- ==========================================================
         DETAIL HASIL SCAN
         ========================================================== -->

    <div
      id="hasilScan"
      class="hasil"
    >

      <div class="hasil-label">
        DETAIL PERALATAN
      </div>


      <div
        id="hasilId"
        class="hasil-id"
      >
        -
      </div>


      <div class="detail-alat">


        <div class="detail-row">
          <span>Kode Barang</span>

          <strong id="detailKodeBarang">
            -
          </strong>
        </div>


        <div class="detail-row">
          <span>Nama Peralatan</span>

          <strong id="detailNamaBarang">
            -
          </strong>
        </div>


        <div class="detail-row">
          <span>Merk</span>

          <strong id="detailMerk">
            -
          </strong>
        </div>


        <div class="detail-row">
          <span>Model / Type</span>

          <strong id="detailModel">
            -
          </strong>
        </div>


        <div class="detail-row">
          <span>Serial Number</span>

          <strong id="detailSerialNumber">
            -
          </strong>
        </div>


        <div class="detail-row">
          <span>Lokasi</span>

          <strong id="detailLokasi">
            -
          </strong>
        </div>


        <div class="detail-row">
          <span>Kondisi</span>

          <strong id="detailKondisi">
            -
          </strong>
        </div>


        <div class="detail-row">
          <span>Keterangan</span>

          <strong id="detailKeterangan">
            -
          </strong>
        </div>


      </div>


      <!-- ========================================================
           STATUS ALAT
           ======================================================== -->

      <div
        id="statusAlatBox"
        class="status-alat"
      >

        <div class="status-alat-label">
          STATUS
        </div>


        <div
          id="detailStatus"
          class="status-alat-value"
        >
          -
        </div>

      </div>


      <!-- ========================================================
           TAMBAHKAN KE PEMINJAMAN
           ======================================================== -->

      <button
        id="btnTambahPeminjaman"
        class="button"
        type="button"
        onclick="tambahKePeminjaman()"
        disabled
      >
        TAMBAHKAN KE PEMINJAMAN
      </button>


    </div>


    <!-- ==========================================================
         ERROR
         ========================================================== -->

    <div
      id="errorBox"
      class="error-box"
    ></div>


    <!-- ==========================================================
         SCAN ALAT LAIN
         ========================================================== -->

    <button
      id="btnScanLagi"
      class="button"
      type="button"
      style="display:none;"
      onclick="mulaiScanner()"
    >
      SCAN ALAT LAIN
    </button>


    <!-- ==========================================================
         KERANJANG PEMINJAMAN
         ========================================================== -->

    <div
      id="panelKeranjangScanner"
      class="keranjang-panel"
    >

      <div class="keranjang-title">
        DAFTAR PEMINJAMAN
      </div>


      <div
        id="jumlahKeranjangScanner"
        class="keranjang-jumlah"
      >
        0 alat
      </div>


      <div id="daftarKeranjangScanner">

        <div class="keranjang-kosong">
          Belum ada alat yang ditambahkan.
        </div>

      </div>


      <button
        id="btnSelesaiScanner"
        class="button"
        type="button"
        onclick="selesaiDariScanner()"
        disabled
      >
        SELESAI
      </button>

    </div>


    <!-- ==========================================================
         CARI ALAT MANUAL
         ========================================================== -->

    <button
      id="btnCariManual"
      class="button-secondary"
      type="button"
      onclick="bukaPencarianManualDariScanner()"
    >
      CARI ALAT MANUAL
    </button>


  </div>

</div>


<script>


// =================================================================
// KONFIGURASI
// =================================================================


// URL WEB APP GOOGLE APPS SCRIPT
//
// Gunakan URL deployment Web App yang sama dengan
// CONFIG.WEB_APP_URL pada Apps Script.
//

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbwPq8v4Xrco0Bj_Un7uWwbdTyAK_IHfULw_lKC99aTI-BiJiIfM8evhW5GLhhlOzzIF/exec';


// =================================================================
// VARIABEL
// =================================================================

let scanner = null;

let sedangMemproses = false;

let alatHasilScan = null;

let keranjangScanner = [];


// =================================================================
// MULAI SCANNER
// =================================================================

async function mulaiScanner() {

  sedangMemproses = false;

  alatHasilScan = null;


  // ---------------------------------------------------------------
  // Sembunyikan hasil scan sebelumnya
  // ---------------------------------------------------------------

  document.getElementById(
    'hasilScan'
  ).style.display = 'none';


  document.getElementById(
    'errorBox'
  ).style.display = 'none';


  document.getElementById(
    'btnScanLagi'
  ).style.display = 'none';


  // ---------------------------------------------------------------
  // Tombol CARI ALAT MANUAL sengaja TIDAK disembunyikan.
  // ---------------------------------------------------------------


  document.getElementById(
    'statusScanner'
  ).innerText =
    'Menyiapkan kamera...';


  // ---------------------------------------------------------------
  // Reset tombol tambah
  // ---------------------------------------------------------------

  const tombolTambah =
    document.getElementById(
      'btnTambahPeminjaman'
    );


  tombolTambah.disabled = true;

  tombolTambah.innerText =
    'TAMBAHKAN KE PEMINJAMAN';


  // ---------------------------------------------------------------
  // Hentikan scanner sebelumnya
  // ---------------------------------------------------------------

  if (scanner) {

    try {

      await scanner.stop();

    } catch (error) {

      console.log(
        'Scanner sebelumnya sudah berhenti.'
      );

    }

  }


  // ---------------------------------------------------------------
  // Buat scanner baru
  // ---------------------------------------------------------------

  scanner =
    new Html5Qrcode(
      'reader'
    );


  try {

    await scanner.start(

      {
        facingMode: 'environment'
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      prosesQRCode

    );


    document.getElementById(
      'statusScanner'
    ).innerText =
      'Arahkan kamera ke QR Code peralatan.';


  } catch (error) {

    console.error(
      error
    );


    document.getElementById(
      'statusScanner'
    ).innerText =
      'Kamera tidak dapat dibuka. Pastikan izin kamera sudah diberikan.';


    document.getElementById(
      'btnScanLagi'
    ).style.display =
      'block';

  }

}


// =================================================================
// PROSES QR
// =================================================================

async function prosesQRCode(
  decodedText
) {

  if (sedangMemproses) {
    return;
  }


  sedangMemproses = true;


  // ---------------------------------------------------------------
  // Hentikan kamera
  // ---------------------------------------------------------------

  try {

    await scanner.stop();

  } catch (error) {

    console.log(
      'Scanner sudah berhenti.'
    );

  }


    // ---------------------------------------------------------------
  // Ambil ID alat
  // ---------------------------------------------------------------

  let idAlat = '';
  const teksBersih = String(decodedText || '').trim();

  // 1. Coba cari parameter id= menggunakan regex (fleksibel untuk berbagai format URL/query)
  const matchId = teksBersih.match(/[?&]id=([^&#\s]+)/i);
  if (matchId) {
    idAlat = decodeURIComponent(matchId[1]).trim();
  } else {
    // 2. Coba parse sebagai URL standar
    try {
      const url = new URL(teksBersih);
      idAlat = url.searchParams.get('id') || '';
    } catch (e) {
      // 3. Jika bukan URL, gunakan teks mentah langsung sebagai ID
      idAlat = teksBersih;
    }
  }


  // ---------------------------------------------------------------
  // QR tidak valid
  // ---------------------------------------------------------------

  if (!idAlat) {

    tampilkanError(
      'QR Code tidak dikenali sebagai QR peralatan.'
    );

    return;

  }


  // ---------------------------------------------------------------
  // Tampilkan status proses
  // ---------------------------------------------------------------

  document.getElementById(
    'statusScanner'
  ).innerText =
    'Mengambil data peralatan...';


  document.getElementById(
    'hasilId'
  ).innerText =
    idAlat;


  // ---------------------------------------------------------------
  // Ambil detail alat
  // ---------------------------------------------------------------

  mintaDetailAlat(
    idAlat
  );

}


// =================================================================
// MEMINTA DETAIL ALAT DARI APPS SCRIPT
// =================================================================

function mintaDetailAlat(
  idAlat
) {


  if (
    !APPS_SCRIPT_URL ||
    APPS_SCRIPT_URL.indexOf(
      'GANTI_DENGAN'
    ) === 0
  ) {

    tampilkanError(
      'URL Apps Script belum diatur pada scanner.'
    );

    return;

  }


  // ---------------------------------------------------------------
  // Buat URL API
  // ---------------------------------------------------------------

  const apiUrl =
    APPS_SCRIPT_URL +
    '?api=alat' +
    '&id=' +
    encodeURIComponent(
      idAlat
    ) +
    '&callback=terimaDetailAlat';


  // ---------------------------------------------------------------
  // JSONP
  // ---------------------------------------------------------------

  const script =
    document.createElement(
      'script'
    );


  script.src =
    apiUrl;


  script.onload =
    function() {

      setTimeout(
        function() {

          script.remove();

        },
        100
      );

    };


  script.onerror =
    function() {

      script.remove();


      tampilkanError(
        'Data peralatan tidak dapat diambil dari server.'
      );

    };


  document.body.appendChild(
    script
  );

}


// =================================================================
// MENERIMA DATA DARI APPS SCRIPT
// =================================================================

function terimaDetailAlat(
  response
) {

  sedangMemproses = false;


  // ---------------------------------------------------------------
  // Validasi response
  // ---------------------------------------------------------------

  if (
    !response ||
    response.success !== true ||
    !response.data
  ) {

    tampilkanError(
      response &&
      response.message
        ? response.message
        : 'Data peralatan tidak ditemukan.'
    );

    return;

  }


  const alat =
    response.data;


  alatHasilScan =
    alat;


  // ---------------------------------------------------------------
  // Isi detail
  // ---------------------------------------------------------------

  document.getElementById(
    'hasilId'
  ).innerText =
    alat.id || '-';


  document.getElementById(
    'detailKodeBarang'
  ).innerText =
    alat.kodeBarang || '-';


  document.getElementById(
    'detailNamaBarang'
  ).innerText =
    alat.namaBarang || '-';


  document.getElementById(
    'detailMerk'
  ).innerText =
    alat.merk || '-';


  document.getElementById(
    'detailModel'
  ).innerText =
    alat.model || '-';


  document.getElementById(
    'detailSerialNumber'
  ).innerText =
    alat.serialNumber || '-';


  document.getElementById(
    'detailLokasi'
  ).innerText =
    alat.lokasi || '-';


  document.getElementById(
    'detailKondisi'
  ).innerText =
    alat.kondisi || '-';


  document.getElementById(
    'detailKeterangan'
  ).innerText =
    alat.keterangan || '-';


  // ---------------------------------------------------------------
  // Status
  // ---------------------------------------------------------------

  const status =
    String(
      alat.status || ''
    )
    .trim()
    .toUpperCase();


  const statusElement =
    document.getElementById(
      'detailStatus'
    );


  statusElement.innerText =
    status || '-';


  statusElement.classList.remove(
    'status-tersedia',
    'status-digunakan',
    'status-lain'
  );


  if (
    status === 'TERSEDIA'
  ) {

    statusElement.classList.add(
      'status-tersedia'
    );

  }

  else if (
    status === 'DIGUNAKAN'
  ) {

    statusElement.classList.add(
      'status-digunakan'
    );

  }

  else {

    statusElement.classList.add(
      'status-lain'
    );

  }


  // ---------------------------------------------------------------
  // Tampilkan hasil
  // ---------------------------------------------------------------

  document.getElementById(
    'hasilScan'
  ).style.display =
    'block';


  document.getElementById(
    'statusScanner'
  ).innerText =
    'QR Code berhasil dibaca.';


  // ---------------------------------------------------------------
  // Tombol
  // ---------------------------------------------------------------

  document.getElementById(
    'btnScanLagi'
  ).style.display =
    'block';


  const btnTambah =
    document.getElementById(
      'btnTambahPeminjaman'
    );


  // ---------------------------------------------------------------
  // Hanya alat TERSEDIA yang boleh dilanjutkan
  // ---------------------------------------------------------------

  btnTambah.disabled =
    status !== 'TERSEDIA';

}


// =================================================================
// TAMPILKAN ERROR
// =================================================================

function tampilkanError(
  pesan
) {

  sedangMemproses = false;


  document.getElementById(
    'hasilScan'
  ).style.display =
    'none';


  document.getElementById(
    'errorBox'
  ).innerText =
    pesan;


  document.getElementById(
    'errorBox'
  ).style.display =
    'block';


  document.getElementById(
    'statusScanner'
  ).innerText =
    'Pemindaian selesai.';


  document.getElementById(
    'btnScanLagi'
  ).style.display =
    'block';

}


// =================================================================
// TAMBAHKAN KE PEMINJAMAN
// =================================================================

function tambahKePeminjaman() {

  // ---------------------------------------------------------------
  // Pastikan data alat tersedia
  // ---------------------------------------------------------------

  if (!alatHasilScan) {

    alert(
      'Data alat belum tersedia.'
    );

    return;

  }


  // ---------------------------------------------------------------
  // Hanya alat TERSEDIA yang boleh ditambahkan
  // ---------------------------------------------------------------

  if (
    String(
      alatHasilScan.status
    )
    .trim()
    .toUpperCase()
    !== 'TERSEDIA'
  ) {

    alert(
      'Alat ini tidak tersedia untuk dipinjam.'
    );

    return;

  }


  // ---------------------------------------------------------------
  // Pastikan halaman peminjaman masih terbuka
  // ---------------------------------------------------------------

  if (
    !window.opener ||
    window.opener.closed
  ) {

    alert(
      'Halaman peminjaman tidak ditemukan. ' +
      'Silakan buka halaman peminjaman terlebih dahulu.'
    );

    return;

  }


  // ---------------------------------------------------------------
  // Ubah format data agar sama dengan keranjang Apps Script
  // ---------------------------------------------------------------

  const alatUntukKeranjang = {

    idAlat:
      alatHasilScan.id || '',

    kodeBarang:
      alatHasilScan.kodeBarang || '',

    namaBarang:
      alatHasilScan.namaBarang || '',

    merk:
      alatHasilScan.merk || '',

    model:
      alatHasilScan.model || '',

    serialNumber:
      alatHasilScan.serialNumber || '',

    kelompok:
      alatHasilScan.kelompok || '',

    subKelompok:
      alatHasilScan.subKelompok || '',

    tahun:
      alatHasilScan.tahun || '',

    lokasi:
      alatHasilScan.lokasi || '',

    kondisi:
      alatHasilScan.kondisi || '',

    status:
      alatHasilScan.status || '',

    keterangan:
      alatHasilScan.keterangan || ''

  };


  // ---------------------------------------------------------------
  // Kirim permintaan penambahan ke halaman peminjaman
  // ---------------------------------------------------------------

  window.opener.postMessage(

    {
      type: 'tambah-alat',

      alat:
        alatUntukKeranjang
    },

    '*'

  );


  // ---------------------------------------------------------------
  // Tombol menunggu hasil dari Apps Script
  // ---------------------------------------------------------------

   const tombol =
    document.getElementById(
      'btnTambahPeminjaman'
    );

  tombol.innerText =
    'MENAMBAHKAN...';

  tombol.disabled =
    true;

  // Timeout pengaman jika pesan postMessage tidak dibalas dalam 6 detik
  setTimeout(function() {
    if (tombol.innerText === 'MENAMBAHKAN...') {
      tombol.disabled = false;
      tombol.innerText = 'TAMBAHKAN KE PEMINJAMAN';
      const statusBox = document.getElementById('statusScanner');
      if (statusBox) {
        statusBox.innerText = 'Tidak ada balasan dari halaman peminjaman. Pastikan tab peminjaman tetap terbuka.';
      }
    }
  }, 6000);


// =================================================================
// RENDER KERANJANG SCANNER
// =================================================================

function renderKeranjangScanner() {

  const jumlah =
    document.getElementById(
      'jumlahKeranjangScanner'
    );


  const daftar =
    document.getElementById(
      'daftarKeranjangScanner'
    );


  const tombolSelesai =
    document.getElementById(
      'btnSelesaiScanner'
    );


  jumlah.innerText =
    keranjangScanner.length +
    ' alat';


  tombolSelesai.disabled =
    keranjangScanner.length === 0;


  if (
    keranjangScanner.length === 0
  ) {

    daftar.innerHTML =
      '<div class="keranjang-kosong">' +
      'Belum ada alat yang ditambahkan.' +
      '</div>';

    return;

  }


  let html = '';


  keranjangScanner.forEach(
    function(alat) {

      const idAlat =
        alat.idAlat || '';


      html +=

        '<div class="keranjang-item">' +

          '<div class="keranjang-item-nama">' +
            escapeHtmlScanner(
              alat.namaBarang || '-'
            ) +
          '</div>' +

          '<div class="keranjang-item-id">' +
            escapeHtmlScanner(
              idAlat || '-'
            ) +
          '</div>' +

          '<div class="keranjang-item-detail">' +

            '<b>Kode Barang:</b> ' +
            escapeHtmlScanner(
              alat.kodeBarang || '-'
            ) +

            '<br>' +

            '<b>Merk:</b> ' +
            escapeHtmlScanner(
              alat.merk || '-'
            ) +

            '<br>' +

            '<b>Model:</b> ' +
            escapeHtmlScanner(
              alat.model || '-'
            ) +

          '</div>' +

          '<button ' +
            'type="button" ' +
            'class="button-hapus" ' +
            'onclick="hapusDariScanner(\'' +
              escapeJsScanner(
                idAlat
              ) +
            '\')"' +
          '>' +
            'HAPUS' +
          '</button>' +

        '</div>';

    }
  );


  daftar.innerHTML =
    html;

}


// =================================================================
// ESCAPE HTML
// =================================================================

function escapeHtmlScanner(
  value
) {

  return String(
    value == null
      ? ''
      : value
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#39;'
    );

}


// =================================================================
// ESCAPE JAVASCRIPT
// =================================================================

function escapeJsScanner(
  value
) {

  return String(
    value || ''
  )

    .replace(
      /\\/g,
      '\\\\'
    )

    .replace(
      /'/g,
      "\\'"
    );

}


// =================================================================
// MEMBERITAHU HALAMAN PEMINJAMAN
// =================================================================

function beriTahuHalamanPeminjaman() {

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type:
          'scanner-siap'
      },

      '*'

    );

  }

}


// =================================================================
// HAPUS ALAT DARI KERANJANG
// =================================================================

function hapusDariScanner(
  idAlat
) {

  if (
    !window.opener ||
    window.opener.closed
  ) {

    alert(
      'Halaman peminjaman tidak ditemukan.'
    );

    return;

  }


  window.opener.postMessage(

    {
      type:
        'hapus-alat',

      idAlat:
        idAlat
    },

    '*'

  );

}


// =================================================================
// CARI ALAT MANUAL
// =================================================================

function bukaPencarianManualDariScanner() {

  if (
    !window.opener ||
    window.opener.closed
  ) {

    alert(
      'Halaman peminjaman tidak ditemukan.'
    );

    return;

  }


  window.opener.postMessage(

    {
      type:
        'buka-pencarian-manual'
    },

    '*'

  );


  window.opener.focus();

}


// =================================================================
// SELESAI DARI SCANNER
// =================================================================

function selesaiDariScanner() {

  if (
    keranjangScanner.length === 0
  ) {

    return;

  }


  if (
    !window.opener ||
    window.opener.closed
  ) {

    alert(
      'Halaman peminjaman tidak ditemukan.'
    );

    return;

  }


  window.opener.postMessage(

    {
      type:
        'selesai-keranjang'
    },

    '*'

  );


  window.opener.focus();

}


// =================================================================
// MENERIMA PESAN DARI HALAMAN PEMINJAMAN
// =================================================================

window.addEventListener(
  'message',

  function(event) {

    const data =
      event.data;


    if (
      !data ||
      !data.type
    ) {

      return;

    }


    // -------------------------------------------------------------
    // KERANJANG DIPERBARUI
    // -------------------------------------------------------------

    if (
      data.type ===
      'keranjang-diperbarui'
    ) {

      if (
        Array.isArray(
          data.keranjang
        )
      ) {

        keranjangScanner =
          data.keranjang;

        renderKeranjangScanner();

      }


      return;

    }


    // -------------------------------------------------------------
    // HASIL PENAMBAHAN ALAT
    // -------------------------------------------------------------

    if (
      data.type ===
      'alat-tambah-hasil'
    ) {

      if (
        Array.isArray(
          data.keranjang
        )
      ) {

        keranjangScanner =
          data.keranjang;

        renderKeranjangScanner();

      }


      const tombol =
        document.getElementById(
          'btnTambahPeminjaman'
        );


      if (
        data.success === true
      ) {

        tombol.innerText =
          '✓ DITAMBAHKAN KE PEMINJAMAN';


        tombol.disabled =
          true;


        document.getElementById(
          'statusScanner'
        ).innerText =
          data.message ||
          'Alat berhasil ditambahkan ke peminjaman.';

      }

      else {

        tombol.innerText =
          'TAMBAHKAN KE PEMINJAMAN';


        const status =
          document.getElementById(
            'statusScanner'
          );


        status.innerText =
          data.message ||
          'Alat tidak dapat ditambahkan.';


        // Jika alat duplicate, tombol tetap
        // bisa digunakan setelah scan alat lain.
        tombol.disabled =
          String(
            alatHasilScan &&
            alatHasilScan.status || ''
          )
          .trim()
          .toUpperCase()
          !== 'TERSEDIA';

      }


      return;

    }

  }

);


// =================================================================
// SAAT HALAMAN SELESAI DIMUAT
// =================================================================

window.addEventListener(
  'load',

  function() {

    // Render keranjang kosong terlebih dahulu
    renderKeranjangScanner();


    // Beri tahu halaman peminjaman bahwa
    // scanner sudah siap menerima data keranjang.
    beriTahuHalamanPeminjaman();


    // Mulai kamera.
    mulaiScanner();

  }

);


</script>
